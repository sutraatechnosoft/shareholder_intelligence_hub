services:
  db:
    image: postgres:16
    container_name: dashboard_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 10

  odoo:
    image: odoo:19
    container_name: dashboard_dev_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      ADMIN_PASSWD: odoo
    volumes:
          - odoo-web-data:/var/lib/odoo
          - .:/mnt/extra-addons
          - ./odoo.conf:/etc/odoo/odoo.conf

volumes:
  odoo-db-data:
  odoo-web-data:
